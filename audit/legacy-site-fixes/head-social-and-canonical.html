<!--
  ============================================================
  OPEN GRAPH / TWITTER / CANONICAL TAGS
  ============================================================
  WHERE: paste inside <head> of EVERY page, right after the
  existing <meta name="description"> line.

  WHAT TO CHANGE PER PAGE: edit the 4 values marked {{...}}.
  Everything else stays the same site-wide.

  NOTE ON og:image:
    Social platforms need an ABSOLUTE url and ideally a
    1200x630 px image. The logo will work but looks small in
    previews. Recommended: create /img/og/og-default.jpg at
    1200x630 and point og:image to it. Per-product pages can
    point to their own product image instead.
  ============================================================
-->

<!-- Canonical (prevents duplicate-URL penalties) -->
<link rel="canonical" href="https://www.suvicointl.com/{{PAGE_PATH}}">

<!-- Open Graph (Facebook, LinkedIn, WhatsApp link previews) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Suvico International">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{PAGE_DESCRIPTION}}">
<meta property="og:url" content="https://www.suvicointl.com/{{PAGE_PATH}}">
<meta property="og:image" content="https://www.suvicointl.com/{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_US">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{PAGE_TITLE}}">
<meta name="twitter:description" content="{{PAGE_DESCRIPTION}}">
<meta name="twitter:image" content="https://www.suvicointl.com/{{OG_IMAGE}}">
