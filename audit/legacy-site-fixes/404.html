<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found (404) | Suvico International</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/logos/favicon.png">
  <style>
    :root { --green:#2e7d32; --ink:#1f2a24; --muted:#5b6b62; --bg:#f6f8f6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           font-family:'Segoe UI',Arial,Helvetica,sans-serif; background:var(--bg); color:var(--ink); padding:24px; }
    .card { max-width:560px; text-align:center; }
    .logo { height:48px; margin-bottom:28px; }
    .code { font-size:96px; line-height:1; font-weight:800; color:var(--green); margin:0; letter-spacing:-2px; }
    h1 { font-size:26px; margin:12px 0 8px; }
    p { color:var(--muted); font-size:16px; line-height:1.6; margin:0 auto 28px; max-width:440px; }
    .actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    a.btn { display:inline-block; text-decoration:none; padding:12px 22px; border-radius:8px; font-weight:600; font-size:15px; }
    a.primary { background:var(--green); color:#fff; }
    a.ghost { background:#fff; color:var(--ink); border:1px solid #d6e0d8; }
    a.primary:hover { background:#256528; }
    a.ghost:hover { border-color:var(--green); color:var(--green); }
    .links { margin-top:28px; font-size:14px; }
    .links a { color:var(--green); text-decoration:none; margin:0 8px; }
    .links a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/img/logos/logo.png" alt="Suvico International">
    <p class="code">404</p>
    <h1>This page couldn't be found</h1>
    <p>The page you were looking for may have moved or no longer exists. Let's get you back to our products.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to Home</a>
      <a class="btn ghost" href="/contact">Request a Quote</a>
    </div>
    <div class="links">
      <a href="/essential-oils">Essential Oils</a> ·
      <a href="/dehydrates">Dehydrates</a> ·
      <a href="/our-story">Our Story</a> ·
      <a href="/blog">Blog</a>
    </div>
  </div>
</body>
</html>
